name: 每日更新社宅官方文件

on:
  schedule:
    - cron: "20 6 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      task:
        description: 要執行的工作
        required: true
        default: daily-update
        type: choice
        options:
          - daily-update
          - gemini-test

concurrency:
  group: daily-housing-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.event_name == 'schedule' || inputs.task == 'daily-update'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: 取出 repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-housing-update.txt

      - name: 安裝 PDF 轉檔工具
        run: python -m pip install -r .github/requirements-housing-update.txt

      - name: 設定門牌快取月份
        id: address-cache-key
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: 還原位置資料快取
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/housing-address-cache
            ${{ runner.temp }}/housing-nationwide-cache
          key: housing-address-${{ runner.os }}-${{ steps.address-cache-key.outputs.month }}

      - name: 盤點全臺社宅位置 API v2
        env:
          HOUSING_NATIONWIDE_CACHE: ${{ runner.temp }}/housing-nationwide-cache
        run: |
          python .claude/skills/housing-doc-to-json/scripts/test_nationwide_housing.py
          if [[ -f api/v2/index.json ]]; then
            python .claude/skills/housing-doc-to-json/scripts/nationwide_housing.py
            python .claude/skills/housing-doc-to-json/scripts/nationwide_housing.py --validate-only
          else
            python .claude/skills/housing-doc-to-json/scripts/nationwide_housing.py --audit-only
          fi

      - name: 盤點並更新官方文件
        run: |
          export HOUSING_PDF_CACHE="$RUNNER_TEMP/housing-pdf-cache"
          export HOUSING_UPDATE_SUMMARY="$RUNNER_TEMP/housing-update-summary.md"
          python -u .claude/skills/housing-doc-to-json/scripts/daily_update.py

      - name: 驗證完整資料集與來源出處
        run: |
          python .claude/skills/housing-doc-to-json/scripts/validate_dataset.py
          python .claude/skills/housing-doc-to-json/scripts/test_housing_locations.py

      - name: 更新並驗證社宅位置 API
        env:
          HOUSING_ADDRESS_CACHE: ${{ runner.temp }}/housing-address-cache
        run: |
          python .claude/skills/housing-doc-to-json/scripts/housing_locations.py
          python .claude/skills/housing-doc-to-json/scripts/housing_locations.py --validate-only

      - name: 保存全臺稽核結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nationwide-housing-audit
          path: ${{ runner.temp }}/housing-nationwide-cache/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: 顯示更新摘要
        run: cat "$RUNNER_TEMP/housing-update-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: 檢查是否有變更
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 使用 dwhao84 身分提交更新
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          branch="dwhao84/automated-housing-update"
          git config user.name "dwhao84"
          git config user.email "dawei84@hotaileasing.com.tw"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git add README.md .claude/skills/housing-doc-to-json/batch/portal_inventory.json
          git add -- '*/*.json'
          git add api
          git commit -m "每日更新社宅官方文件（$(date +%F)）"
          git push --force-with-lease origin "HEAD:$branch"

      - name: 建立或更新每日更新 PR
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          branch="dwhao84/automated-housing-update"
          body_file="$RUNNER_TEMP/housing-update-pr.md"
          {
            echo "本 PR 由每日排程自動產生，不會自動合併。"
            echo
            cat "$RUNNER_TEMP/housing-update-summary.md"
            echo
            echo "## 驗證"
            echo '- JSON 結構、頁數、SHA-256、官方來源 URL 與出處欄位已通過全庫驗證。'
          } > "$body_file"
          number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "每日更新社宅官方文件" --body-file "$body_file"
          else
            gh pr create --base main --head "$branch" --title "每日更新社宅官方文件" --body-file "$body_file"
          fi

  test-gemini:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'gemini-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: 呼叫 Gemini 3.5 Flash-Lite
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              raise SystemExit("GEMINI_API_KEY repository secret is not set")

          url = (
              "https://generativelanguage.googleapis.com/v1beta/models/"
              "gemini-3.5-flash-lite:generateContent"
          )
          body = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": (
                                  "請使用繁體中文，只回覆：Gemini API 連線成功"
                              )
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0,
                  "maxOutputTokens": 128,
              },
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key,
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Gemini API failed: HTTP {error.code}: {detail}")

          text = result["candidates"][0]["content"]["parts"][0]["text"]
          print(f"Gemini response: {text.strip()}")
          PY
